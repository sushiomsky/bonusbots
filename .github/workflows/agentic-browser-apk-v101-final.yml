name: Build Agentic Browser APK v1.0.1 Final

on:
  push:
    branches:
      - build/agentic-browser-setup-apk-v101-20260831

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 and build tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: agentic-browser-setup
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature
        working-directory: agentic-browser-setup
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: APK checksums
        working-directory: agentic-browser-setup
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agentic-browser-setup-v1.0.1-final-apk
          path: agentic-browser-setup/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
